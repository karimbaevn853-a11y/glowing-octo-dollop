<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLand - Mini App</title>
    <!-- Telegram Web App kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS orqali dizayn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card-bg {
            background: linear-gradient(135deg, #111113 0%, #1a1a1e 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-border {
            border: 1px solid rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER (Profil va Balans) -->
    <header class="flex justify-between items-center p-4 border-b border-zinc-800">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center font-bold text-lg" id="user-avatar">N</div>
            <div>
                <div class="font-bold text-sm" id="user-name">Nursultan</div>
                <div class="text-xs text-zinc-400">до IRON ⚔️</div>
            </div>
        </div>
        <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full px-3 py-1.5 space-x-2">
            <span class="font-bold text-sm" id="user-balance">0.03 💎</span>
            <button class="w-7 h-7 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-lg hover:bg-blue-500">+</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 space-y-4">

        <!-- SLOTS BO'LIMI -->
        <div class="card-bg rounded-2xl p-4 neon-border relative overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <span class="bg-red-500/20 text-red-400 text-xs px-2.5 py-1 rounded-full font-semibold">✨ Новинка</span>
                <span class="text-xs text-zinc-400">🎰 СЛОТЫ</span>
            </div>
            <div class="flex justify-around items-center py-2 bg-black/40 rounded-xl">
                <div class="text-3xl">🍎</div>
                <div class="text-3xl">🐸</div>
                <div class="text-3xl">🧢</div>
            </div>
        </div>

        <!-- CRASH O'YINI -->
        <div class="card-bg rounded-2xl p-4 relative overflow-hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="bg-blue-500/20 text-blue-400 text-xs px-2.5 py-1 rounded-full font-semibold">📈 Хит</span>
            </div>
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-extrabold tracking-wide">CRASH</h2>
                    <p class="text-xs text-zinc-400">Tezkor raundlar va koeffitsiyentlar</p>
                </div>
                <div class="text-2xl">🚀</div>
            </div>
        </div>

        <!-- KETMA-KET BOSHQA O'YINLAR (KEYLAR, MINES, APGRADE) -->
        <div class="grid grid-cols-1 gap-3">
            <div class="card-bg rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <span class="text-xs text-emerald-400 font-semibold">💎 Классика</span>
                    <h3 class="text-lg font-bold">КЕЙСЫ</h3>
                </div>
                <div class="text-2xl">🎁</div>
            </div>

            <div class="card-bg rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <span class="text-xs text-blue-400 font-semibold">💎 Классика</span>
                    <h3 class="text-lg font-bold">MINES</h3>
                </div>
                <div class="text-2xl">💣</div>
            </div>

            <div class="card-bg rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <span class="text-xs text-green-400 font-semibold">❤️ Популярное</span>
                    <h3 class="text-lg font-bold">АПГРЕЙД</h3>
                </div>
                <div class="text-2xl">🧸</div>
            </div>
        </div>

    </main>

    <!-- PASTKI NAVIGATSIYA MENYusi (Bottom Bar) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-950/90 backdrop-blur-md border-t border-zinc-800 flex justify-around py-3 px-2">
        <button onclick="switchTab('inventory')" class="flex flex-col items-center text-zinc-400 hover:text-white">
            <span class="text-xl">📦</span>
            <span class="text-[10px] mt-1">Инвентарь</span>
        </button>
        <button onclick="switchTab('games')" class="flex flex-col items-center text-blue-500">
            <span class="text-xl">🎮</span>
            <span class="text-[10px] mt-1">Игры</span>
        </button>
        <button onclick="switchTab('tasks')" class="flex flex-col items-center text-zinc-400 hover:text-white">
            <span class="text-xl">💎</span>
            <span class="text-[10px] mt-1">Задания</span>
        </button>
        <button onclick="switchTab('leaders')" class="flex flex-col items-center text-zinc-400 hover:text-white">
            <span class="text-xl">🏆</span>
            <span class="text-[10px] mt-1">Лидеры</span>
        </button>
    </nav>

    <script>
        // Telegram WebApp ni sozlash va foydalanuvchi ma'lumotlarini chiqarish
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || "Nursultan";
            document.getElementById('user-avatar').innerText = (user.first_name || "N")[0].toUpperCase();
        }

        function switchTab(tabName) {
            alert(tabName + " bo'limi ochildi!");
        }
    </script>
</body>
</html>
